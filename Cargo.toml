[workspace]
resolver = "3"
members = [
    "crates/cfe-msg",
    "crates/cfe-msg-ffi",
    "crates/cfe-sys",
    "crates/cfe",
    "apps/link_lab",
    "apps/link_lab/core",
    "apps/step_lab",
    "apps/step_lab/core",
    "apps/scn_lab",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/kscharpf/cfs-rs"
publish = false

[workspace.dependencies]
cfe-msg = { path = "crates/cfe-msg" }
cfe-sys = { path = "crates/cfe-sys" }
cfe = { path = "crates/cfe" }
step-lab-core = { path = "apps/step_lab/core" }
link-lab-core = { path = "apps/link_lab/core" }
aldis = { git = "https://github.com/kscharpf/aldis.git", rev = "4852ee687ab64b22041dfb556c33ef0dc8666e83", default-features = false, features = ["core", "spp", "epp", "tm", "tc", "link", "cop1", "time", "spp-time"] }
refapp-scenario = { git = "https://github.com/kscharpf/aldis.git", rev = "4852ee687ab64b22041dfb556c33ef0dc8666e83" }
refapp-flight = { git = "https://github.com/kscharpf/aldis.git", rev = "4852ee687ab64b22041dfb556c33ef0dc8666e83" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
as_conversions = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
alloc_instead_of_core = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
string_slice = "deny"
infinite_loop = "deny"
mem_forget = "deny"
as_pointer_underscore = "deny"
lossy_float_literal = "deny"
allow_attributes = "deny"
wildcard_enum_match_arm = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_rest_pattern = "deny"
shadow_same = "deny"
excessive_nesting = "deny"
else_if_without_else = "deny"

# The C-export crate is a `no_std` static library: it cannot unwind into C.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
