[workspace]
resolver = "3"
members = [
    "crates/cfe-msg",
    "crates/cfe-msg-ffi",
    "crates/cfe-sys",
    "crates/cfe",
    "apps/link_lab",
    "apps/link_lab/core",
    "apps/step_lab",
    "apps/step_lab/core",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/kscharpf/cfs-rs"
publish = false

[workspace.dependencies]
cfe-msg = { path = "crates/cfe-msg" }
cfe-sys = { path = "crates/cfe-sys" }
cfe = { path = "crates/cfe" }
step-lab-core = { path = "apps/step_lab/core" }
aldis = { git = "https://github.com/kscharpf/aldis.git", rev = "4852ee687ab64b22041dfb556c33ef0dc8666e83", default-features = false, features = ["core", "spp", "epp", "tm", "tc", "link", "cop1", "time", "spp-time"] }
refapp-scenario = { git = "https://github.com/kscharpf/aldis.git", rev = "4852ee687ab64b22041dfb556c33ef0dc8666e83" }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

# The C-export crate is a `no_std` static library: it cannot unwind into C.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
